spring.application.name=FreshTrack

# Server Port (Render dynamically assigns PORT; defaults to 8080 if absent)
server.port=${PORT:8080}

# MySQL Database configuration using environment variables
# In production (Render + Aiven MySQL), set: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:freshtrack_db}?sslMode=PREFERRED&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Optional local overrides for developer workstation (gitignored)
spring.config.import=optional:classpath:application-local.properties
